<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rustam Atakishiev — Портфолио</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Karla:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ececec;
    --bg2: #e0e0e0;
    --dark: #2b2b2b;
    --text: #2b2b2b;
    --muted: #8c8c8c;
    --line: #cfcfcf;
    --white: #f6f6f6;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Karla', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  a { color: inherit; }

  /* Cursor (только на устройствах с мышью) */
  .cursor, .cursor-ring { display: none; }
  @media (hover: hover) and (pointer: fine) {
    body, a, button, .photo-card { cursor: none; }
    .cursor, .cursor-ring { display: block; }
    .cursor {
      position: fixed; width: 8px; height: 8px;
      background: var(--dark); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor-ring {
      position: fixed; width: 32px; height: 32px;
      border: 1px solid var(--muted); border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width .3s, height .3s, opacity .3s;
    }
    .cursor-ring.expand { width: 56px; height: 56px; opacity: .5; }
  }

  /* Nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px 52px; z-index: 100;
    mix-blend-mode: multiply;
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; letter-spacing: .12em;
    text-transform: uppercase; text-decoration: none;
  }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a {
    font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; transition: color .3s;
  }
  .nav-links a:hover { color: var(--text); }

  /* Hero */
  .hero {
    min-height: 100vh;
    display: grid; grid-template-columns: 1fr 1fr;
    opacity: 0; animation: fadeUp 1.2s ease .2s forwards;
  }
  .hero-left {
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 52px 72px;
  }
  .hero-label {
    font-size: .65rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 24px;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.4rem, 6.4vw, 7.4rem);
    font-weight: 300; line-height: 1; letter-spacing: -.01em;
  }
  .hero-title em { font-style: italic; color: var(--muted); display: block; }
  .hero-right { background: var(--bg2); }
  .hero-img { width: 100%; height: 100%; background: linear-gradient(145deg, #7d7d7d 0%, #4a4a4a 100%); }

  /* Sections */
  section { padding: 120px 52px; }
  .section-label {
    font-size: .62rem; letter-spacing: .25em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 60px;
    display: flex; align-items: center; gap: 16px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  /* Gallery */
  .gallery-filter { display: flex; margin-bottom: 56px; border-bottom: 1px solid var(--line); }
  .filter-btn {
    background: none; border: none;
    font-family: 'Karla', sans-serif; font-size: .7rem; font-weight: 300;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); padding: 12px 24px 12px 0;
    position: relative; transition: color .3s;
  }
  .filter-btn::after {
    content: ''; position: absolute; bottom: -1px; left: 0; right: 24px;
    height: 1px; background: var(--dark);
    transform: scaleX(0); transform-origin: left; transition: transform .3s ease;
  }
  .filter-btn.active { color: var(--text); }
  .filter-btn.active::after, .filter-btn:hover::after { transform: scaleX(1); }

  .gallery-grid {
    display: grid; grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 80px; gap: 6px;
  }
  .photo-card {
    position: relative; overflow: hidden;
    opacity: 0; animation: fadeUp .8s ease forwards;
    transition: opacity .4s;
  }
  .photo-card:nth-child(1) { grid-column: 1/6;   grid-row: 1/5;  animation-delay: .10s; }
  .photo-card:nth-child(2) { grid-column: 6/10;  grid-row: 1/4;  animation-delay: .20s; }
  .photo-card:nth-child(3) { grid-column: 10/13; grid-row: 1/3;  animation-delay: .25s; }
  .photo-card:nth-child(4) { grid-column: 6/10;  grid-row: 4/7;  animation-delay: .30s; }
  .photo-card:nth-child(5) { grid-column: 10/13; grid-row: 3/7;  animation-delay: .35s; }
  .photo-card:nth-child(6) { grid-column: 1/4;   grid-row: 5/9;  animation-delay: .40s; }
  .photo-card:nth-child(7) { grid-column: 4/9;   grid-row: 7/10; animation-delay: .45s; }
  .photo-card:nth-child(8) { grid-column: 9/13;  grid-row: 7/10; animation-delay: .50s; }
  .photo-card:nth-child(9) { grid-column: 1/4;   grid-row: 9/11; animation-delay: .55s; }

  .photo-inner { width: 100%; height: 100%; transition: transform .6s cubic-bezier(.25,.46,.45,.94); }
  .photo-card:hover .photo-inner { transform: scale(1.04); }
  .photo-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { width: 100%; height: 100%; }
  .ph-1 { background: linear-gradient(135deg, #3a3a3a, #8a8a8a); }
  .ph-2 { background: linear-gradient(160deg, #b4b4b4, #6e6e6e); }
  .ph-3 { background: linear-gradient(120deg, #8f8f8f, #565656); }
  .ph-4 { background: linear-gradient(150deg, #2e2e2e, #5c5c5c); }
  .ph-5 { background: linear-gradient(140deg, #a6a6a6, #737373); }
  .ph-6 { background: linear-gradient(130deg, #c4c4c4, #8c8c8c); }
  .ph-7 { background: linear-gradient(155deg, #484848, #8a8a8a); }
  .ph-8 { background: linear-gradient(125deg, #7a7a7a, #4a4a4a); }
  .ph-9 { background: linear-gradient(145deg, #bcbcbc, #808080); }

  .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.5), transparent 50%);
    opacity: 0; transition: opacity .4s ease;
    display: flex; align-items: flex-end; padding: 16px;
  }
  .photo-card:hover .photo-overlay { opacity: 1; }
  .photo-meta { font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.8); }

  /* About */
  #about { background: var(--bg2); }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: end; }
  .about-portrait { aspect-ratio: 3/4; background: linear-gradient(145deg, #bdbdbd, #8f8f8f); max-width: 460px; }
  .about-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.6rem, 5vw, 5rem);
    font-weight: 300; line-height: 1.05; margin-bottom: 24px;
  }
  .about-name em { font-style: italic; color: var(--muted); display: block; }
  .about-city {
    font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  }

  /* Contact */
  #contact { background: var(--dark); color: var(--white); }
  #contact .section-label { color: #9a9a9a; }
  #contact .section-label::after { background: rgba(255,255,255,.12); }
  .contact-list { list-style: none; max-width: 760px; }
  .contact-list li { border-bottom: 1px solid rgba(255,255,255,.12); }
  .contact-list a {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 24px; padding: 32px 0; text-decoration: none;
    transition: padding-left .4s ease, color .3s;
  }
  .contact-list a:hover { padding-left: 16px; color: #fff; }
  .contact-kind {
    font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: #9a9a9a;
    flex-shrink: 0;
  }
  .contact-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 3.2vw, 2.6rem); font-weight: 300;
    text-align: right; overflow-wrap: anywhere;
  }

  /* Footer */
  footer {
    background: var(--dark); padding: 28px 52px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .footer-copy { font-size: .62rem; letter-spacing: .12em; color: rgba(255,255,255,.35); }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(20,20,20,.96); z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  .lightbox.open { opacity: 1; pointer-events: all; }
  .lightbox-inner { width: min(86vw, 70vmin); height: 80vmin; max-height: 80vh; position: relative; }
  .lightbox-view { width: 100%; height: 100%; }
  .lightbox-view img { width: 100%; height: 100%; object-fit: contain; }
  .lightbox-close {
    position: absolute; top: -40px; right: 0; background: none; border: none;
    font-size: .65rem; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(255,255,255,.5); transition: color .3s;
  }
  .lightbox-close:hover { color: #fff; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Mobile */
  @media (max-width: 800px) {
    nav { padding: 20px 24px; }
    .nav-links { gap: 18px; }
    section { padding: 80px 24px; }
    .hero { grid-template-columns: 1fr; }
    .hero-left { padding: 0 24px 48px; order: 2; min-height: 55vh; }
    .hero-right { order: 1; min-height: 45vh; }
    .about-grid { grid-template-columns: 1fr; gap: 40px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 160px; }
    .photo-card:nth-child(n) { grid-column: auto; grid-row: auto; }
    .photo-card:nth-child(1), .photo-card:nth-child(7) { grid-column: span 2; }
    .contact-list a { flex-direction: column; gap: 8px; }
    .contact-value { text-align: left; }
    footer { padding: 24px; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="#" class="nav-logo">Rustam Atakishiev</a>
  <ul class="nav-links">
    <li><a href="#work">Работы</a></li>
    <li><a href="#about">Обо мне</a></li>
    <li><a href="#contact">Контакт</a></li>
  </ul>
</nav>

<header class="hero">
  <div class="hero-left">
    <p class="hero-label">Санкт-Петербург</p>
    <h1 class="hero-title">Rustam<em>Atakishiev</em></h1>
  </div>
  <div class="hero-right">
    <!-- Главное фото: замени div на <img src="photos/main.jpg" style="width:100%;height:100%;object-fit:cover;"> -->
    <div class="hero-img"></div>
  </div>
</header>

<section id="work">
  <p class="section-label">Работы</p>

  <div class="gallery-filter">
    <button class="filter-btn active" onclick="setFilter(this,'all')">Все</button>
    <button class="filter-btn" onclick="setFilter(this,'color')">Цветные</button>
    <button class="filter-btn" onclick="setFilter(this,'bw')">Чёрно-белые</button>
  </div>

  <div class="gallery-grid">
    <div class="photo-card" data-type="bw" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-1"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Ч/Б</span></div>
    </div>
    <div class="photo-card" data-type="color" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-2"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Цвет</span></div>
    </div>
    <div class="photo-card" data-type="color" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-3"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Цвет</span></div>
    </div>
    <div class="photo-card" data-type="bw" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-4"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Ч/Б</span></div>
    </div>
    <div class="photo-card" data-type="bw" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-5"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Ч/Б</span></div>
    </div>
    <div class="photo-card" data-type="color" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-6"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Цвет</span></div>
    </div>
    <div class="photo-card" data-type="bw" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-7"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Ч/Б</span></div>
    </div>
    <div class="photo-card" data-type="color" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-8"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Цвет</span></div>
    </div>
    <div class="photo-card" data-type="bw" onclick="openLightbox(this)">
      <div class="photo-inner"><div class="ph ph-9"></div></div>
      <div class="photo-overlay"><span class="photo-meta">Ч/Б</span></div>
    </div>
  </div>
</section>

<section id="about">
  <p class="section-label">Обо мне</p>
  <div class="about-grid">
    <!-- Портрет: замени div на <img src="photos/portrait.jpg" style="width:100%;height:100%;object-fit:cover;"> -->
    <div class="about-portrait"></div>
    <div>
      <h2 class="about-name">Rustam<em>Atakishiev</em></h2>
      <p class="about-city">Санкт-Петербург</p>
    </div>
  </div>
</section>

<section id="contact">
  <p class="section-label">Контакт</p>
  <ul class="contact-list">
    <li>
      <a href="mailto:rustamex@gmail.com">
        <span class="contact-kind">Email</span>
        <span class="contact-value">rustamex@gmail.com</span>
      </a>
    </li>
    <li>
      <a href="https://t.me/luxfugax" target="_blank" rel="noopener">
        <span class="contact-kind">Telegram</span>
        <span class="contact-value">t.me/luxfugax</span>
      </a>
    </li>
  </ul>
</section>

<footer>
  <span class="footer-copy">© 2026 Rustam Atakishiev</span>
</footer>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-inner" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()">Закрыть ✕</button>
    <div class="lightbox-view" id="lbView"></div>
  </div>
</div>

<script>
  // Курсор
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
  });
  (function loop() {
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a,button,.photo-card').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('expand'));
    el.addEventListener('mouseleave', () => ring.classList.remove('expand'));
  });

  // Фильтр
  function setFilter(btn, type) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.photo-card').forEach(card => {
      const match = type === 'all' || card.dataset.type === type;
      card.style.opacity = match ? '1' : '0.15';
      card.style.pointerEvents = match ? 'all' : 'none';
    });
  }

  // Лайтбокс: показывает то же, что в карточке (фото или серый блок)
  function openLightbox(card) {
    const view = document.getElementById('lbView');
    const img = card.querySelector('img');
    view.innerHTML = '';
    if (img) {
      const big = document.createElement('img');
      big.src = img.src;
      view.appendChild(big);
    } else {
      const ph = card.querySelector('.ph').cloneNode(true);
      view.appendChild(ph);
    }
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
